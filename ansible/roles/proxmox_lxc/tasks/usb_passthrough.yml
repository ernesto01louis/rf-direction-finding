---
# USB passthrough into a privileged LXC (rfdf-daq capture host).
#
# Grants the container the USB device cgroup and bind-mounts the host's USB
# bus. Sufficient for SDRs (B210, RTL-SDR, HackRF) — the device appears under
# /dev/bus/usb inside the container. This is the simpler alternative to full
# USB-controller passthrough to a VM; the VM path is documented in
# docs/infrastructure/proxmox-setup.md for operators who prefer it.
#
# Runs against the Proxmox host over SSH (the API has no LXC-USB knob).

- name: "Append USB cgroup + mount rules to the container config"
  ansible.builtin.blockinfile:
    path: "/etc/pve/lxc/{{ proxmox_vmid }}.conf"
    marker: "# {mark} ANSIBLE rfdf usb-passthrough"
    block: |
      lxc.cgroup2.devices.allow: c 189:* rwm
      lxc.mount.entry: /dev/bus/usb dev/bus/usb none bind,optional,create=dir
  delegate_to: "{{ proxmox_api_host }}"
  vars:
    ansible_user: root
  register: _usb_cfg

- name: "Restart the container to apply USB passthrough"
  when: _usb_cfg is changed
  community.proxmox.proxmox:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_token_id: "{{ proxmox_api_token_id }}"
    api_token_secret: "{{ proxmox_api_token_secret }}"
    validate_certs: "{{ proxmox_api_validate_certs }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ proxmox_vmid }}"
    state: restarted
  delegate_to: localhost

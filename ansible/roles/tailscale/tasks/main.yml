---
# tailscale — join each host to the operator's tailnet.
# Skipped entirely when tailscale_enabled is false.

- name: Tailscale block
  when: tailscale_enabled | default(false)
  block:
    - name: Add the Tailscale apt signing key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Add the Tailscale apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
          https://pkgs.tailscale.com/stable/debian bookworm main
        filename: tailscale
        state: present

    - name: Install tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Enable and start tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Check current Tailscale connection state
      ansible.builtin.command: tailscale status --json
      register: _ts_status
      changed_when: false
      failed_when: false

    # `tailscale up` is idempotent, but only invoke it when not already joined
    # so a re-run doesn't churn the auth key.
    - name: Join the tailnet
      ansible.builtin.command: >-
        tailscale up
        --authkey={{ tailscale_auth_key }}
        --hostname={{ inventory_hostname }}
        {{ tailscale_up_flags }}
        {{ '--advertise-routes=' + tailscale_advertise_routes if tailscale_advertise_routes else '' }}
      when: >-
        _ts_status.rc != 0
        or (_ts_status.stdout | from_json).BackendState | default('') != 'Running'
      register: _ts_up
      changed_when: _ts_up.rc == 0

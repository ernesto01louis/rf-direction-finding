---
# common — base OS configuration applied to every LXC guest.
# Idempotent: safe to re-run as the first step of any playbook.

- name: Set the system timezone
  community.general.timezone:
    name: "{{ infra_timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - htop
      - jq
      - python3
      - rsync
      - unattended-upgrades
      - vim
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Generate the configured locale
  community.general.locale_gen:
    name: "{{ infra_locale }}"
    state: present

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "{{ 1 if infra_unattended_upgrades else 0 }}";
    owner: root
    group: root
    mode: "0644"

- name: Ensure NTP time sync is active (Authelia TOTP + alerting need it)
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

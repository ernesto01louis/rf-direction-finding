# ---------------------------------------------------------------------------
# vault/secrets.example.yml — TEMPLATE for the encrypted secrets file.
#
# This example is plaintext and committed. The REAL file is vault/secrets.yml,
# encrypted with ansible-vault and git-ignored:
#
#     cp vault/secrets.example.yml vault/secrets.yml
#     ansible-vault encrypt vault/secrets.yml
#     echo "<your-vault-password>" > ansible/.vault-pass   # git-ignored
#
# `make provision` reads the password from ansible/.vault-pass (see ansible.cfg).
# See SECURITY.md "Infrastructure secrets (ansible-vault)" for the full policy.
# ---------------------------------------------------------------------------

# --- Proxmox API ------------------------------------------------------------
proxmox_api_token_secret: "REPLACE-with-the-API-token-secret"

# --- Tailscale (only needed when tailscale_enabled: true) ------------------
tailscale_auth_key: "tskey-auth-REPLACE"

# --- Authelia ---------------------------------------------------------------
# Generate randoms with: openssl rand -hex 32
authelia_jwt_secret: "REPLACE-openssl-rand-hex-32"
authelia_session_secret: "REPLACE-openssl-rand-hex-32"
authelia_storage_encryption_key: "REPLACE-openssl-rand-hex-32"
authelia_oidc_hmac_secret: "REPLACE-openssl-rand-hex-32"
# OIDC signing key. Generate an RSA-4096 PEM (`openssl genrsa 4096`) and paste
# it here as a YAML literal block — keep the four-space indent:
#   authelia_oidc_private_key: |
#     <PEM line 1>
#     <PEM line 2>
#     ...
authelia_oidc_private_key: "REPLACE-with-an-RSA-4096-PEM-block"

# Initial operator login. Hash with:
#   docker run authelia/authelia:4.39.5 authelia crypto hash generate argon2
authelia_admin_username: "operator"
authelia_admin_display_name: "RF Operator"
authelia_admin_email: "operator@rf.lan"
authelia_admin_password_hash: "$argon2id$v=19$m=65536,t=3,p=4$REPLACE"

# --- SMTP relay for Authelia password-reset / 2FA mail ---------------------
# Leave smtp_host empty to fall back to the filesystem notifier (writes to a
# file inside the container instead of sending mail) — fine for a solo homelab.
authelia_smtp_host: ""
authelia_smtp_port: 587
authelia_smtp_username: ""
authelia_smtp_password: ""
authelia_smtp_sender: "authelia@rf.lan"

# --- Redis password (Authelia session store) ------------------------------
authelia_redis_password: "REPLACE-openssl-rand-hex-24"

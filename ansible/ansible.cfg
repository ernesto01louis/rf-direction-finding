# Ansible configuration for the rfdf Stage 6 software-ecosystem deployment.
# Run all playbooks from inside this directory: `cd ansible && ansible-playbook ...`
# or use the repo-root `make provision` target.
[defaults]
ansible_managed = Ansible managed
inventory = inventory.yml
roles_path = roles
collections_path = collections
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
callbacks_enabled = ansible.posix.profile_tasks
interpreter_python = auto_silent
forks = 10
display_skipped_hosts = False
# Vault password is supplied at run time by `make provision`
# (ANSIBLE_VAULT_PASSWORD_FILE) — not pinned here, so ansible-lint and
# inventory-only commands work without a vault password present.

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30

[privilege_escalation]
become = True
become_method = sudo

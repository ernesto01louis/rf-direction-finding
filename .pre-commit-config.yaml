# Pinned versions per Stage 1 §11. Dependabot security advisories may
# propose bumps; review carefully before merging — pre-commit hook versions
# affect every commit, including bypass attempts.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  # Pinned to track the dev/CI ruff line (pyproject.toml [dev] uses ruff>=0.7,
  # which resolves to the latest). Keeping this pin behind the CI ruff caused a
  # format-rule skew (assert-message wrapping changed between 0.7 and 0.15);
  # bump this rev whenever the CI ruff line moves a minor.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Pinned to track the dev/CI mypy line (pyproject.toml [dev] uses mypy>=1.13,
  # which resolves to the latest). Keeping this pin behind the CI mypy caused an
  # unused-ignore skew: mypy 1.x and 2.x disagree on which `# type: ignore`
  # comments torch's untyped return types require. Bump this rev whenever the
  # CI mypy line moves.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies:
          - "pydantic>=2.7"
          - "pydantic-settings>=2.3"
          - "typer>=0.12"
          - "structlog>=24"
          - "platformdirs>=4"
          - "numpy>=1.26"
          - "types-PyYAML"
          # Stage 7: light optional SDKs that the orchestrator / api
          # subtrees type-check against. Pure-Python, so the isolated
          # hook env can carry them (unlike torch / runpod).
          # ai-orchestrator-client is pinned to the git main branch
          # until 0.1.1 lands on PyPI (the published 0.1.0 lacks the
          # signature-preserving @capability fix). UPGRADE PATH: switch
          # to "ai-orchestrator-client>=0.1.1" once 0.1.1 is on PyPI.
          - "ai-orchestrator-client @ git+https://github.com/ernesto01louis/ai-orchestrator-client@main"
          - "fastapi>=0.115"
        # Limit mypy to the package under src/; tests are excluded by pyproject.toml.
        # src/rfdf/ml/ and src/rfdf/backends/compute/ are excluded here: they
        # import heavy domain SDKs (torch, runpod, ...) that this isolated hook
        # env cannot carry. The `lint` CI job installs those extras and is the
        # complete mypy gate for those two subtrees.
        files: ^src/rfdf/
        exclude: ^src/rfdf/(ml|backends/compute)/

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.31.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

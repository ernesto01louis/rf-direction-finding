# Pinned versions per Stage 1 §11. Dependabot security advisories may
# propose bumps; review carefully before merging — pre-commit hook versions
# affect every commit, including bypass attempts.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - "pydantic>=2.7"
          - "pydantic-settings>=2.3"
          - "typer>=0.12"
          - "structlog>=24"
          - "platformdirs>=4"
          - "numpy>=1.26"
          - "types-PyYAML"
        # Limit mypy to the package under src/; tests are excluded by pyproject.toml.
        files: ^src/rfdf/

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.31.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

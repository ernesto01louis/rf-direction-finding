name = "protocol-id-resnet2d"

[dataset]
kind = "protocol"
num_samples_per_signal = 512
num_iq_samples = 4096
impairments = "cabled"
seed = 0

[model]
architecture = "resnet2d"
num_classes = 5
input_shape = [2, 64, 64]

[training]
epochs = 40
batch_size = 128
learning_rate = 1e-3
optimizer = "adamw"
scheduler = "cosine"
warmup_steps = 200
grad_accum_steps = 1
amp = false
ddp = false
checkpoint_every_steps = 500
keep_top_k = 3
seed = 0
wandb = false
mlflow = false

[compute]
backend = "local"
gpu_count = 1
gpu_min_vram_gb = 8.0
timeout_h = 6.0
priority = "normal"
pip_requirements = ["rfdf[ml,ml-onnx]"]

[project]
name = "rfdf"
version = "0.1.0"
description = "Hardware-agnostic RF direction finding, signal classification, and phased-array research platform"
authors = [{name = "Louis", email = "louis_ernesto@aol.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
keywords = ["rf", "sdr", "doa", "direction-finding", "signal-classification", "phased-array", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "sigmf>=1.2",
    "structlog>=24",
    "platformdirs>=4",
]

[project.optional-dependencies]
# --- SDR backends ---
sdr-uhd = ["uhd>=4.7"]
sdr-pluto = ["pyadi-iio>=0.0.18"]
sdr-soapy = ["SoapySDR>=0.8"]
# --- Rotator backends ---
rotator-hamlib = ["hamlib-py>=4.5"]
rotator-antrunner = ["httpx>=0.27"]
# --- Geometry backends ---
geometry-grbl = ["httpx>=0.27"]
# --- ML ---
ml = ["torch>=2.5", "torchvision>=0.20", "torchsig>=2.0", "scikit-learn>=1.5", "h5py>=3.11"]
ml-onnx = ["onnx>=1.17", "onnxruntime>=1.20"]
ml-hailo = []  # vendor SDK installed externally; no PyPI package
ml-coreml = ["coremltools>=8.0"]
ml-tflite = ["ai-edge-torch>=0.2"]  # torch->TFLite converter (verified in the export PR)
# --- Compute backends ---
compute-runpod = ["runpod>=1.7"]
compute-modal = ["modal>=0.65"]
compute-vastai = ["vastai>=0.2"]
compute-skypilot = ["skypilot[aws,gcp]>=0.7"]
# --- Orchestrator integration (optional) ---
# >=0.1.1: 0.1.1 makes @capability signature-preserving (mypy --strict).
orchestrator = ["ai-orchestrator-client>=0.1.1,<0.2"]
# --- API + web ---
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "websockets>=13"]
# --- Antenna modelling ---
antenna = ["scikit-rf>=1.2", "necpp>=1.7", "PyNEC>=1.7"]
# --- Dev / tooling ---
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4",
    "commitizen>=3",
    "types-PyYAML",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.27"]
# --- Test-only cross-validation (DOA estimators checked vs an independent library) ---
crosscheck = ["pyargus>=1.0", "matplotlib>=3.5"]
# --- Convenience meta-extras ---
all-hardware = ["rfdf[sdr-uhd,sdr-pluto,sdr-soapy,rotator-hamlib,rotator-antrunner,geometry-grbl]"]
all-compute = ["rfdf[compute-runpod,compute-modal,compute-vastai,compute-skypilot]"]
all = ["rfdf[ml,ml-onnx,ml-coreml,ml-tflite,api,antenna,all-hardware,all-compute,orchestrator]"]

[project.scripts]
rfdf = "rfdf.cli.main:app"

# Backend discovery (one entry-point per HAL Protocol group). Backends ship in
# the base package because they only depend on numpy + sigmf (also base deps);
# vendor SDKs (uhd, hamlib, runpod, …) remain behind optional extras.
[project.entry-points."rfdf.backends.sdr"]
mock = "rfdf.backends.sdr.mock:create"
file-replay = "rfdf.backends.sdr.file_replay:create"
b210 = "rfdf.backends.sdr.b210:create"

[project.entry-points."rfdf.backends.rotator"]
mock = "rfdf.backends.rotator.mock:create"
antrunner = "rfdf.backends.rotator.antrunner:create"

[project.entry-points."rfdf.backends.geometry"]
static = "rfdf.backends.geometry.static:create"
mock-morph = "rfdf.backends.geometry.mock_morph:create"
grbl-linear = "rfdf.backends.geometry.grbl_linear:create"

[project.entry-points."rfdf.backends.compute"]
local = "rfdf.backends.compute.local:create"
modal = "rfdf.backends.compute.modal:create"
runpod = "rfdf.backends.compute.runpod:create"
skypilot = "rfdf.backends.compute.skypilot:create"
vastai = "rfdf.backends.compute.vastai:create"

[project.urls]
Homepage = "https://github.com/ernesto01louis/rf-direction-finding"
Documentation = "https://github.com/ernesto01louis/rf-direction-finding"
Issues = "https://github.com/ernesto01louis/rf-direction-finding/issues"
Changelog = "https://github.com/ernesto01louis/rf-direction-finding/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfdf"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["examples/**/*.ipynb"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "RUF", "D"]
extend-ignore = ["D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["src/rfdf"]

[[tool.mypy.overrides]]
module = ["tests.*", "examples.*"]
ignore_errors = true

# scikit-rf (read lazily in rfdf.dsp.calibration) ships no type stubs.
[[tool.mypy.overrides]]
module = ["skrf.*"]
ignore_missing_imports = true

# Stage 5 hardware SDKs + transports. uhd ships no stubs; httpx / websockets
# ship stubs but are not installed in the lint CI job (they live behind the
# [sdr-uhd] / [rotator-antrunner] / [geometry-grbl] extras). All lazy-imported.
[[tool.mypy.overrides]]
module = ["uhd.*", "httpx.*", "websockets.*"]
ignore_missing_imports = true

# SciPy ships no type stubs.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# Stage 4 ML + compute-provider SDKs ship no (or incomplete) type stubs. They are
# all lazy-imported behind the [ml] / [compute-*] extras; mypy treats them as Any.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchvision.*",
    "torchsig.*",
    "onnx.*",
    "onnxruntime.*",
    "coremltools.*",
    "ai_edge_torch.*",
    "litert_torch.*",
    "tensorflow.*",
    "sklearn.*",
    "h5py.*",
    "runpod.*",
    "modal.*",
    "vastai.*",
    "sky.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "hardware: requires physical RF hardware (skipped by default)",
    "slow: takes more than 10 seconds",
    "integration: requires multiple components or external services",
    "gpu: requires a CUDA-capable GPU",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/rfdf"]
branch = true
# Stage 4: src/rfdf/ml/ and the cloud compute backends only import once the
# [ml] / [compute-*] extras are installed, which the base `coverage` job does
# not do. They get their own 75% floor in the `coverage-ml` CI job — see
# .coveragerc-ml. local.py stays measured here (no domain dependencies).
#
# Stage 5: the hardware backends drive real UHD / GRBL devices — their device
# lifecycle cannot run in CI. Their pure helpers are unit-tested; the full
# backend is verified by the `hardware`-marked suite on the self-hosted runner.
omit = [
    "src/rfdf/ml/*",
    "src/rfdf/backends/compute/runpod.py",
    "src/rfdf/backends/compute/modal.py",
    "src/rfdf/backends/compute/vastai.py",
    "src/rfdf/backends/compute/skypilot.py",
    "src/rfdf/backends/compute/_remote_storage.py",
    "src/rfdf/backends/sdr/b210.py",
    "src/rfdf/backends/_grbl.py",
    "src/rfdf/backends/rotator/antrunner.py",
    "src/rfdf/backends/geometry/grbl_linear.py",
]

[tool.coverage.report]
fail_under = 80  # Stage 3 ratchet (Stage 1 set 0, Stage 2 raised it to 70).
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Release workflow — scaffolded but INACTIVE until v0.1.0.
#
# Stage 1 ships this file so the wiring is reviewable, but PyPI Trusted
# Publishing configuration (https://docs.pypi.org/trusted-publishers/) is NOT
# yet activated on pypi.org. First publish lands at v0.1.0 (post-Stage 7) per
# the Stage 1 handoff guidance.
#
# Activation steps (post-Stage 7):
#   1. Reserve the `rfdf` project name on PyPI.
#   2. Configure a Trusted Publisher pointing at this workflow
#      (repository: ernesto01louis/rf-direction-finding, workflow: release.yml,
#       environment: pypi).
#   3. Remove the `if: false` guard from the publish-pypi job below.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # required by PyPI Trusted Publishing

jobs:
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build backend
        run: |
          python -m pip install -U pip
          python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract CHANGELOG section for tag
        id: changelog
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # Best-effort: extract the section heading + body for [<version>] from CHANGELOG.md
          awk -v ver="$version" '
            $0 ~ "^## \\["ver"\\]" {flag=1; print; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md || true
          [ -s release-notes.md ] || echo "See CHANGELOG.md" > release-notes.md
          echo "tag=$tag" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.changelog.outputs.tag }}" dist/* \
            --title "${{ steps.changelog.outputs.tag }}" \
            --notes-file release-notes.md

  publish-pypi:
    name: publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: build
    if: false   # FLIP TO `true` AT v0.1.0 ONCE TRUSTED PUBLISHER IS CONFIGURED
    environment:
      name: pypi
      url: https://pypi.org/p/rfdf
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

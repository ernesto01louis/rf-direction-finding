# Release workflow — ACTIVE since v0.1.0 (Stage 7).
#
# On a `v*` tag push: builds the wheel + sdist, creates a GitHub Release,
# and publishes to PyPI via Trusted Publishing
# (https://docs.pypi.org/trusted-publishers/). The `rfdf` Trusted Publisher
# (repository ernesto01louis/rf-direction-finding, workflow release.yml,
# environment pypi) is registered on pypi.org.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # required by PyPI Trusted Publishing

jobs:
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build backend
        run: |
          python -m pip install -U pip
          python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract CHANGELOG section for tag
        id: changelog
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # Best-effort: extract the section heading + body for [<version>] from CHANGELOG.md
          awk -v ver="$version" '
            $0 ~ "^## \\["ver"\\]" {flag=1; print; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md || true
          [ -s release-notes.md ] || echo "See CHANGELOG.md" > release-notes.md
          echo "tag=$tag" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.changelog.outputs.tag }}" dist/* \
            --title "${{ steps.changelog.outputs.tag }}" \
            --notes-file release-notes.md

  publish-pypi:
    name: publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/rfdf
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

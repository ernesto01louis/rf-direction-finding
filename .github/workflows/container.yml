# Container image workflow — scaffolded but INACTIVE.
#
# This workflow would build the rfdf training image from the repo-root
# Dockerfile and push it to the GitHub Container Registry as
# ghcr.io/ernesto01louis/rfdf-training:<tag>. The cloud compute backends
# (RunPod, Vast.ai, SkyPilot) would then pull that image instead of running a
# `pip install` at job start.
#
# Operator decision: NO live GHCR push this stage. The build-and-push job below
# is guarded `if: false` — exactly as the publish-pypi job in release.yml is —
# so the workflow never actually runs. Until it is enabled, the cloud backends
# use the `pip install rfdf[ml,ml-onnx]` fallback into a stock PyTorch base
# image, which needs no published image.
#
# Activation steps (when a live training image is wanted):
#   1. Confirm the `Dockerfile` at the repo root builds cleanly.
#   2. GHCR publishing uses the workflow's `GITHUB_TOKEN` with `packages: write`
#      — no extra secret needed for a same-org image.
#   3. Remove the `if: false` guard from the build-and-push job below.

name: container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build + push training image to GHCR
    runs-on: ubuntu-latest
    if: false # FLIP TO `true` TO ENABLE LIVE GHCR PUBLISHING OF THE TRAINING IMAGE
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag
        id: meta
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=${tag:-latest}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/ernesto01louis/rfdf-training:${{ steps.meta.outputs.tag }}
            ghcr.io/ernesto01louis/rfdf-training:latest
